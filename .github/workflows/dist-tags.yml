name: dist-tags

# Installable git tags, one per package, for hosts that depend on
# git+https://github.com/re-cinq/planning-station.git#<package>-dist-v<version>
# while the packages are not on a registry. Bump the versions first.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: for dir in packages/*/; do ./scripts/dist-tag.sh "${dir%/}"; done
      - run: git push origin --tags
